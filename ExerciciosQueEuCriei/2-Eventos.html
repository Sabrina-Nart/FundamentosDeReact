<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios que eu criei</title>
</head>
<body>
    <div id="root"></div>
        
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>   

    <script type="text/babel">

        function Alerta1() {
            function handleAlertClick() {
                console.log("Clicou no botão de alerta")
                alert("Clicou no botão de alerta")
            }

            return (
                <button type="button" onClick={handleAlertClick} className="bg-pink-400 hover:bg-pink-700 text-white font-bold py-2 px-4 rounded"> Clique aqui para gerar um alerta </button>
            )
        }

        function Alerta2() {
            function handleAlertClick(msg) {
                alert(msg)
            }

            return (
                <button type="button" 
                        onClick={() => handleAlertClick("Mostrar Alerta com Parâmetro")} 
                        className="bg-green-400 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
                        Mostrar Alerta com Parâmetro
                </button>
            )
        }

        function Alerta3() {
            function handleAlertClick(event) {
                alert(event.target.previousSibling.value )
            }

            function handleInputChange(event) {
                console.log(event.target.value)
            }

            return (
                <div>
                    <input type="text" placeholder="Digite algo: " onChange={handleInputChange} />
                    <button onClick={handleAlertClick}> Mostrar Alerta </button>
                </div>
            )
        }

        function App() {
            return (
                <main>
                    <Alerta1 />
                    <Alerta2 />
                    <Alerta3 />
                </main>
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script> 

</body>
</html>
