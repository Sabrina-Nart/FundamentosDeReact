<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocketseat - React.js - Fundamentos</title>
</head>
<body>
    <div id="root"></div>
        
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>   

    <script type="text/babel">

        function App() {
            const [is12Hours, setIs12Hours] = React.useState(false); //Por padrão, começa cpm 12 horas
            const [time, setTime] = React.useState('');

            const updateTime = React.useCallback(() => { //Função que altera nosso relógio a cada segundo
                const now = new Date(Date.now());
                const formattedTime = now.toLocaleTimeString('pt-BR', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: is12Hours //Um etado que depende de uma função
                });

                setTime(formattedTime);
            }, [is12Hours]);

            //Essa função está sendo executada em um effect, que depende de um timer, que é um relógio
            React.useEffect(() => { //useEffect = Tem função de saída
                updateTime();

                const timer = setInterval(() => { //A cada um segundo eu quero que execute
                    updateTime();
                }, 1000);

                return () => clearInterval(timer);
            }, [updateTime]); //Toda vez que o useEffect criar uma fnção nova, ele vai destruir a antiga


            return (
                <main>
                    <div>🕔 {time}</div>

                    <button onClick={() => setIs12Hours(!is12Hours)}>Alterar para o formato {is12Hours ? '24 horas' : '12 horas'}</button>
                </main>
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script> 

</body>
</html>
