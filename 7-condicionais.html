<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocketseat - React.js - Fundamentos</title>
</head>
<body>
    <div id="root"></div>
        
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>   

    <script type="text/babel">

        function Counter() {
            const [counter, setCounter] = React.useState(0); //Uma dupla - Indice 1 e - O primeito é o Valor que vai ter (estado) e o segundo é a função que vai atualizar o valor - O zero é o valor padrão

            if (counter > 20) { //If clássico
                return <p>Maior que 20</p>
            } {/*Enquanto não for 20, ele vai continuar renderizando a tela*/}

            return (
                <>
                    <p>Contador: {counter}</p>

                    <p>{counter > 10 ? 'Maior que 10' : 'Menor que 10'}</p> {/*E*/}

                    {counter > 15 && <p>Maior que 15</p>} {/*Curto circuito*/}

                    <button onClick={() => setCounter(10)}>Atualizar</button>
                    <button onClick={() => setCounter((prevValue) => (prevValue + 1))}>Incrementar</button>
                    <button onClick={() => setCounter((prevValue) => (prevValue - 1))}>Decrementar</button>
                </>
            )
        }

        function App() {
            return (
                <main class="p-3">
                    <Counter />
                </main>
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script> 

</body>
</html>
