<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocketseat - React.js - Fundamentos</title>
</head>
<body>
    <div id="root"></div>
        
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>   

    <script type="text/babel">

        function InputFocus() {
            
            const ref = React.useRef(null) //Referencia nula, pois as vezes, o componente começã sem valor
            
            function handleClick() { //Ficar de fato com o foco - AS vezes o componente pode não existir
                ref?.current?.focus() //Se o JavaScript focar em algo qe não existe, ele quebra
            }

            return (
                <div className="space-x-2">
                    <input ref={ref} className="p-2 border" placeholder="Clique no botão para focar" />
                    <button onClick={handleClick} className="p-2 border"> Focar no Input</button>
                </div>
            ) 
        }
//////////////////////////////////////////////////////////////////

        function ScrollTracker() {
            const containerRef = React.useRef(null) //Ir atualizando a porcentagem a medida que o scroll vai mudando
            
            const [scrollInfo, setScrollInfo] = React.useState({
                scrollTop: 0, //Não popula de início
                scrollHeight: 0,
                clientHeight: 0
            })

            const [scrollPercentage, setScrollPercentage] = React.useState(0);

            function handleContainerScroll() {
                if (!containerRef.current) { //Se não tiver um current
                    return; //Se não existir, retorna
                }

                        //Onde estou no scroll - Quantidade de scroll - Tamanho do container
                const { scrollTop, scrollHeight, clientHeight } = containerRef.current; //É pego algumas coisas - Informações que vem do JavaScript

                setScrollInfo({
                    scrollTop,
                    scrollHeight,
                    clientHeight
                });

                const maxScroll = scrollHeight - clientHeight;
                const percentage = Math.round((scrollTop / maxScroll) * 100);

                setScrollPercentage(percentage);
            }

            return (
                <div className="space-y-4">
                    <div ref={containerRef} //Porque é aqui que tem o Scroll / Consigo usar esse container para trazer o valor do Scroll
                        onScroll={handleContainerScroll}
                        className={`border borders-solid border-blue-500 p4
                                     h-60 overflow-y-auto`}
                    > 
                        <div className="space-y-4">
                            {Array.from({ length: 20 }).map((_, index) => (
                                <p key={index} className="p2 bg-gray-100 rounded">
                                    Item do conteúdo {index + 1}
                                </p>
                            ))}
                        </div>
                    </div>

                    <div>
                        <ul className="space-y-2 list-disc pl-5">
                            <li>Progresso do scroll (scrollTop): {scrollPercentage}%</li>
                            <li>Onde está o scroll (scrollTop): {scrollInfo.scrollTop}</li>
                            <li>Tamanho do scroll (scrollHeight): {scrollInfo.scrollHeight}</li>
                            <li> Tamanho do container (clientHeight): {scrollInfo.clientHeight}</li>
                        </ul>
                    </div>

                </div>
            )
        }

//////////////////////////////////////////////////////////////////

        function App() {
            return (
                <main className="p-3 space-y-6">
                    <InputFocus />

                    <hr />

                    <ScrollTracker />
                </main>
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script> 

</body>
</html>
